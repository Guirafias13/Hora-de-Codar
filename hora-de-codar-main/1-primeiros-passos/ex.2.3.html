<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        //2.3. Leia 3 valores diferentes e mostre o maior.

        var num1 = prompt("Digite o primeiro número:")
        var num2 = prompt("Digite o segundo número diferente:")
        var num3 = prompt("Digite o terceiro número diferente:")

        //Número iguais
        if (num1 == num2 || num1 == num3 || num2 == num3) {
            alert('Erro! Você digitou números são iguais')
        }

        else if (num1 > num2 && num1 > num3) {
            alert(num1 + ' é o maior número')
        }
        else if (num2 > num1 && num2 > num3) {
            alert(num2 + ' é o maior número')
        }
        else if (num3 > num2 && num3 > num1) {
            alert(num3 + ' é o maior número')
        }
    </script>
</head>
