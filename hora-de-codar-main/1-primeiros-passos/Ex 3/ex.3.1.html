    <title>Document</title>
    <script>
        //3.1. Crie uma bomba-relógio com contagem regressiva de 30 até 0 e, ao final, escreva `EXPLOSÃO`.
        var inicio = 30
        var fim = 0

        while (inicio > fim) {
            document.write('<p> Explodindo em ' + inicio + '</p>')
            inicio--
        }
        document.write('EXPLOSÃO!')
    </script>
