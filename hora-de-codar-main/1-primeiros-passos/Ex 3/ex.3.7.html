<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //3.7. Leia um valor `N` (N > 0) e imprima todos os inteiros de 1 até `N`.
        let N = parseInt(prompt("Digite um valor para N (N > 0):"));

        if (N > 0) {
            let n = 1;
            while (n <= N) {
                alert(n);
                n++;
            }
        } else {
            alert("Por favor, digite um valor válido para N.");
        }
    </script>
</head>
