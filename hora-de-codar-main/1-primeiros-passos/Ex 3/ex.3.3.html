<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3.3</title>
    <script>
        // 3.3. Calcule e exiba a média aritmética dos números inteiros de 15 a 100 (inclusive).

        var soma = 0;
        var quantidade = 0;

        var n = 15
        while (n <= 100) {
            n++
            soma = soma + n;       // Acumula o valor do número atual
            quantidade = quantidade + 1; // Conta quantos números já somamos
        }

        var media = soma / quantidade;

        alert('A soma de 15 a 100 é: ' + soma);
        alert('A quantidade de números é: ' + quantidade);
        alert('A média aritmética de 15 a 100 é: ' + media);

    </script>
</head>
