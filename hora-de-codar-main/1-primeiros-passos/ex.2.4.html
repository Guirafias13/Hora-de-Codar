<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //2.4. Leia 3 valores diferentes e mostre a soma dos 2 maiores.

        var valor1 = parseInt(prompt('Digite o primeiro número:'));
        var valor2 = parseInt(prompt('Digite o segundo número:'));
        var valor3 = parseInt(prompt('Digite o terceiro número:'));

        // Validação para garantir que são diferentes
        if (valor1 == valor2 || valor2 == valor3 || valor1 == valor3) {
            alert('Erro: Os 3 valores devem ser diferentes!');
        }
        else {
            let soma;

            // Se o valor1 for o menor, os maiores são valor2 e valor3
            if (valor1 < valor2 && valor1 < valor3) {
                soma = valor2 + valor3;
            }
            // Se o valor2 for o menor, os maiores são valor1 e valor3
            else if (valor2 < valor1 && valor2 < valor3) {
                soma = valor1 + valor3;
            }
            // Se o valor3 for o menor, os maiores são valor1 e valor2
            else {
                soma = valor1 + valor2;
            }

            alert('A soma dos dois maiores números é: ' + soma);
        }
    </script>
</head>

</body>

</html>
