    <script>
        //2.6. Leia 4 valores diferentes e informe apenas o primeiro, o último e o maior deles.
        var num1 = prompt('Digite o primeiro o valor:')
        var num2 = prompt('Digite o segundo o valor:')
        var num3 = prompt('Digite o terceiro o valor:')
        var num4 = prompt('Digite o quarto o valor:')

        const maior = Math.max(num1, num2, num3, num4)

        alert('Este é o primeiro numero digitado: ' + num1)
        alert('Este é o último numero digitado: ' + num4)
        alert('Este é o maior numero digitado: ' + maior)
    </script>
