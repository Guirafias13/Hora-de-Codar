    <script>
        //2.2. Leia um valor e diga se ele é positivo, negativo ou zero.
var entrada = prompt('Digite um número:'); 

let numero = parseFloat(entrada);

if (numero > 0) {
    alert(numero + ' é positivo'); 
}
else if (numero === 0) { 
    alert(numero + ' é igual a zero');
}
else { // 4. Corrigida a sintaxe do else
    alert(numero + ' é negativo');
}
    </script>
</head>
