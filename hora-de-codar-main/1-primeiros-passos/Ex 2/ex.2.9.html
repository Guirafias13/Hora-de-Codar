<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //2.9. Leia o ano de nascimento e informe se a pessoa pode votar no ano atual (sem considerar o mês).
        var anoNascimento = Number(prompt('Digite o ano de nascimento:'));

        var idade = 2026 - anoNascimento;

        if (idade >= 16) {
            alert('Pode votar! Idade: ' + idade);
        } else {
            alert('Não pode votar. Idade: ' + idade);
        }

    </script>
