    <script>
        //2.1. Leia dois números e mostre o maior deles.

        var numero1 = prompt("Insira um Número:")
        var numero2 = prompt('Insira outro Número:')

        if (numero1 > numero2) {
            alert([numero1], "é maior que"[numero2])
        }
        else if (numero1 < numero2) {
            alert([numero2], "é maior que"[numero1])
        }
    </script>
