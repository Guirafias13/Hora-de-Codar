<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //2.8. Leia 4 números, aceitando apenas valores maiores que 0 e menores que 10. Calcule a média e:
        //- se média > 5, exiba "Você passou no teste";
        //- caso contrário, exiba "Tente novamente".

        var num1 = Number(prompt('Digite o primeiro valor:'));
        var num2 = Number(prompt('Digite o segundo valor:'));
        var num3 = Number(prompt('Digite o terceiro valor:'));
        var num4 = Number(prompt('Digite o quarto valor:'));

        var media = 0

        media = (num1 + num2 + num3 + num4) / 4

        if (media > 5) {
            alert('Você Passou no Teste')
        }
        else {
            alert('Tente Novamente')
        }

    </script>
